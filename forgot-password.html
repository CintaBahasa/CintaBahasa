<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Sandi • CintaBahasa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <a class="auth-logo" href="index.html">CINTABAHASA</a>

    <section class="auth-card">
        <div class="auth-mark">✉</div>
        <div class="eyebrow">ATUR ULANG KATA SANDI</div>
        <h1>Lupa kata sandi?</h1>
        <p class="auth-subtitle">Tautan untuk mengatur ulang kata sandi akan dikirim melalui sistem akun online.</p>

        <form id="forgotPasswordForm">
            <label for="forgotEmail">Email</label>
            <input id="forgotEmail" type="email" placeholder="kamu@contoh.com" autocomplete="email" required>

            <button class="btn primary wide" type="submit">Atur Ulang Kata Sandi</button>
            <p id="forgotMessage" class="message"></p>
        </form>

        <div class="auth-divider"><span>sudah ingat?</span></div>

        <a class="btn secondary wide" href="login.html">← Kembali ke Masuk</a>

        <p class="switch-auth">
            Belum punya akun?
            <a href="signup.html" class="auth-link">Daftar</a>
        </p>
    </section>

    <p class="auth-footer">CintaBahasa • Kuis jadi seru.</p>
</main>

<script type="module" src="auth-ui.js"></script>
</body>
</html>
