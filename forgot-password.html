<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password • QuizNova</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <a class="auth-logo" href="index.html">QUIZNOVA</a>

    <section class="auth-card">
        <div class="auth-mark">✉</div>
        <div class="eyebrow">RESET PASSWORD</div>
        <h1>Forgot your password?</h1>
        <p class="auth-subtitle">Enter the email connected to your QuizNova account and we'll send instructions to reset your password.</p>

        <form id="forgotPasswordForm">
            <label for="forgotEmail">Email</label>
            <input id="forgotEmail" type="email" placeholder="you@example.com" autocomplete="email" required>

            <button class="btn primary wide" type="submit">Send Reset Link</button>
            <p id="forgotMessage" class="message"></p>
        </form>

        <div class="auth-divider"><span>remembered it?</span></div>

        <a class="btn secondary wide" href="login.html">← Back to Log In</a>

        <p class="switch-auth">
            Don't have an account?
            <a href="signup.html" class="auth-link">Sign up</a>
        </p>
    </section>

    <p class="auth-footer">QuizNova • Quiz made fun.</p>
</main>

<script src="auth-ui.js"></script>
<script type="module" src="auth-firebase.js"></script>
</body>
</html>
