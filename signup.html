<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up • QuizNova</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <a class="auth-logo" href="index.html">QUIZNOVA</a>

    <section class="auth-card">
        <div class="auth-mark">★</div>
        <div class="eyebrow">GET STARTED</div>
        <h1>Create your account</h1>
        <p class="auth-subtitle">Choose how you want to use QuizNova.</p>

        <form id="signupForm">
            <label for="signupName">Display name</label>
            <input id="signupName" type="text" maxlength="30" placeholder="Your name" autocomplete="name" required>

            <label>Account type</label>

            <div class="role-grid">
                <label class="role-option selected" data-role="teacher">
                    <input type="radio" name="role" value="teacher" checked>
                    <span class="role-icon">🎓</span>
                    <span class="role-copy">
                        <strong>Teacher</strong>
                        <small>Create and host quizzes</small>
                    </span>
                    <span class="role-check">✓</span>
                </label>

                <label class="role-option" data-role="student">
                    <input type="radio" name="role" value="student">
                    <span class="role-icon">🎮</span>
                    <span class="role-copy">
                        <strong>Student</strong>
                        <small>Join and play quizzes</small>
                    </span>
                    <span class="role-check">✓</span>
                </label>
            </div>

            <label for="signupEmail">Email</label>
            <input id="signupEmail" type="email" placeholder="you@example.com" autocomplete="email" required>

            <label for="signupPassword">Password</label>
            <div class="password-wrap">
                <input id="signupPassword" type="password" minlength="6" placeholder="At least 6 characters" autocomplete="new-password" required>
                <button type="button" class="eye-password" data-target="signupPassword" aria-label="Show password">
                    <span class="eye-icon">◉</span>
                </button>
            </div>

            <label class="terms">
                <input type="checkbox" required>
                <span>I agree to the QuizNova terms and privacy policy.</span>
            </label>

            <button class="btn primary wide" type="submit">Create Account</button>
            <p id="signupMessage" class="message"></p>
        </form>

        <p class="switch-auth">
            Already have an account?
            <a href="login.html" class="auth-link">Log in</a>
        </p>
    </section>

    <p class="auth-footer">QuizNova • Quiz made fun.</p>
</main>

<script src="auth-ui.js"></script>
<script type="module" src="auth-firebase.js"></script>
</body>
</html>
